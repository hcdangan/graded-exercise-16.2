[project]
name = "week16-harleydangan-lab-research-agent"
version = "0.1.0"
description = "Week 16 lab research agent"
authors = [{ name = "Harley Dangan" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.1",
    "grandalf>=0.8",
    "guardrails-ai-detect-jailbreak>=0.1.6",
    "guardrails-ai-detect-prompt-injection==0.2.1a1",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.17",
    "openai>=2.45.0,<3.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "langgraph-cli[inmem]>=0.4.41",
]
