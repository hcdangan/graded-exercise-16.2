[project]
name = "week16-harleydangan-lab-research-agent"
version = "0.1.0"
description = "Week 16 lab research agent"
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.1",
    "guardrails-ai-detect-jailbreak>=0.1.6",
    "guardrails-ai-detect-prompt-injection==0.2.1a1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.17",
    "openai>=2.45.0,<3.0.0",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
